name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true

          direct_prompt: |
            Hey! I'm reviewing this PR like a teammate would. Only comment if you spot actual issues - don't write comments just to write them.

            **Only comment when you find:**
            - Actual bugs or potential runtime errors
            - Security vulnerabilities 
            - Performance issues that matter
            - Missing error handling where it could cause problems
            - Accessibility issues in frontend code
            - Logic errors or edge cases not handled

            **Don't comment on:**
            - Code that's already following good practices
            - Style preferences (we have linters for that)
            - Things that are working fine as-is
            - Minor optimizations that don't really matter

            **How to comment:**
            - Keep it short and friendly, like you're talking to a colleague
            - Point to specific lines when possible
            - Suggest fixes, don't just point out problems
            - Use a casual, helpful tone

            **Context-aware reviewing:**
            - Frontend files: Focus on accessibility, performance, user experience
            - Backend/API files: Focus on security, error handling, data validation
            - Test files: Focus on coverage of edge cases and meaningful assertions
            - Config files: Focus on security and correctness

            If everything looks good, just say "Looks good!" or don't comment at all.